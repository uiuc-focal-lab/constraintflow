[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintflow"
version = "0.1.0"
description = "A DSL and tools for neural network certification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Avaljot Singh" },
    { name = "Yasmin Sarita" },
]
keywords = ["dsl", "neural networks", "certification", "constraint solving"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# The versions the paper's results were measured with.
dependencies = [
    "antlr4-python3-runtime==4.9.2",
    "graphviz==0.20.1",
    "matplotlib==3.10.5",
    "networkx==3.1",
    "numpy==2.2.6",
    "onnx==1.16.2",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "typer==0.24.1",
    "z3-solver==5.1.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["constraintflow*"]

[tool.setuptools.package-data]
constraintflow = ["**/*.txt", "**/*.yml", "**/*.json"]

[project.scripts]
constraintflow = "constraintflow.cli:main"
